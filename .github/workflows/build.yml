name: CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Complete Release Checks Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: rasi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm 10.33.0
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies (frozen, ignore scripts)
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Gate 1 - Check code formatting
        run: corepack pnpm run format:check

      - name: Gate 2 - Run strict linter (max-warnings=0)
        run: corepack pnpm exec eslint . --max-warnings=0

      - name: Gate 3 - Run TypeScript check
        run: corepack pnpm run typecheck

      - name: Gate 4 - Run unit test suites
        env:
          DATABASE_URL: 'postgresql://postgres:postgrespassword@localhost:5432/rasi_test'
          DATABASE_MIGRATION_URL: 'postgresql://postgres:postgrespassword@localhost:5432/rasi_test'
          BETTER_AUTH_SECRET: 'ci-secret-value-must-be-at-least-32-chars-long'
          BETTER_AUTH_URL: 'http://localhost:3000'
        run: corepack pnpm test

      - name: Gate 5 - Build production application
        env:
          DATABASE_URL: 'postgresql://postgres:postgrespassword@localhost:5432/rasi_test'
          DATABASE_MIGRATION_URL: 'postgresql://postgres:postgrespassword@localhost:5432/rasi_test'
          BETTER_AUTH_SECRET: 'ci-secret-value-must-be-at-least-32-chars-long'
          BETTER_AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          SECTORS_API_KEY: 'ci-sectors-dummy-key'
          GEMINI_API_KEY: 'ci-gemini-dummy-key'
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
        run: corepack pnpm run build

      - name: Gate 6 - Production dependency audit
        run: corepack pnpm audit --prod

      - name: Gate 7 - Check git diff whitespace
        run: git diff --check

      - name: Upload build / test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          path: |
            .next/**/*.log
            *.log
          retention-days: 7
